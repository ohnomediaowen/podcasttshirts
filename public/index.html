<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Locally sourced tees from locally sourced podcasts. Podcast merch printed to order in Orlando, Florida.">
<meta property="og:title" content="PodcastTShirts.com">
<meta property="og:description" content="Locally sourced tees from locally sourced podcasts.">
<style>*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<title>PodcastTShirts.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&family=Bowlby+One&family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&family=Karla:wght@400;500;700;800&family=Shrikhand&display=swap">
<style>
/* Layout: a site-wide tab bar on top; under it, each show's page uses one shared template (masthead, shirt cards, order desk) re-skinned by that show's theme tokens. */
:root {
  color-scheme: light;
  /* site chrome */
  --bar-bg: #121212; --bar-ink: #f4f1ea; --bar-muted: #9a958c;
  /* show theme tokens (overwritten per show by script; defaults = Oh No) */
  --page: #faf6ee; --ink: #2b1712; --muted: #6f5a4f; --line: #ddcfbb; --field: #ffffff;
  --head-bg: #4b2219; --head-ink: #fff3cf; --eyebrow: #e0592a; --eyebrow-head: #f2c14e;
  --s1: #e0592a; --s2: #f2c14e; --s3: #2e8293; --swash-h: 30px;
  --btn-bg: #4b2219; --btn-ink: #fff3cf; --btn-shadow: #e0592a;
  --ticket-bg: #4b2219; --ticket-ink: #fff3cf; --tbtn-bg: #f2c14e; --tbtn-ink: #4b2219;
  --focus: #2e8293; --error: #b3261e; --error-bg: #fde8e6;
  --title-shadow: 3px 3px 0 #e0592a, 6px 6px 0 #f2c14e, 9px 9px 0 #2e8293;
  --display: "Shrikhand", "Cooper Black", Georgia, serif; --display-weight: 400; --display-case: none; --display-track: .5px;
  --body: "Karla", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --radius: 22px;
  --site: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
body { background: var(--page); color: var(--ink); font-family: var(--body); font-size: 1rem; line-height: 1.55; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar-bg); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Site bar + tabs */
.sitebar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar-bg); color: var(--bar-ink); font-family: var(--site); }
.sitebar .wrap { display: flex; align-items: center; gap: 1.25rem; padding-block: .55rem; }
.bar-top { display: contents; }
.cartlink { order: 3; flex: none; display: inline-flex; align-items: center; gap: .45rem; color: var(--bar-ink); text-decoration: none; font: 800 .9rem var(--site); padding: .45rem .85rem; border: 1.5px solid var(--bar-muted); border-radius: 999px; white-space: nowrap; }
.cartlink:hover, .cartlink[aria-current="page"] { background: var(--bar-ink); color: var(--bar-bg); border-color: var(--bar-ink); }
.cartlink b { min-width: 1.4rem; height: 1.4rem; padding: 0 .3rem; box-sizing: border-box; border-radius: 999px; background: #e0592a; color: #fff; font-size: .78rem; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.cartlink.bump b { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.35); } }
.brand { font-family: "Archivo Black", var(--site); font-size: 1.05rem; letter-spacing: -.01em; white-space: nowrap; text-decoration: none; }
.brand b { color: var(--bar-muted); font-weight: 400; }
.tabs { display: flex; gap: .3rem; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; -webkit-mask-image: linear-gradient(90deg, #000 92%, transparent); mask-image: linear-gradient(90deg, #000 92%, transparent); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; appearance: none; border: 0; background: transparent; color: var(--bar-muted); font: 700 .9rem var(--site); padding: .55rem .9rem; border-radius: 999px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: .45rem; }
.tab:hover { color: var(--bar-ink); }
.tab[aria-selected="true"] { background: var(--bar-ink); color: var(--bar-bg); }
.tab .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
@media (max-width: 640px) { .sitebar .wrap { flex-direction: column; align-items: stretch; gap: .35rem; } .bar-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; } .tabs { margin-inline: -4px; } }
@media (prefers-reduced-motion: reduce) { .cartlink.bump b { animation: none; } }

/* POD notice */
.pod { background: var(--page); border-bottom: 1px solid var(--line); }
.pod .wrap { padding-block: .7rem; font-size: .92rem; display: flex; flex-wrap: wrap; gap: .15rem .6rem; align-items: baseline; }
.pod strong { white-space: nowrap; color: var(--eyebrow); text-transform: uppercase; letter-spacing: .1em; font-size: .76rem; }

/* Masthead */
.mast { background: var(--head-bg); color: var(--head-ink); }
.mast .wrap { padding-block: 2.5rem 2rem; display: grid; gap: .5rem; }
.mast h1 { font-family: var(--display); font-weight: var(--display-weight); text-transform: var(--display-case); letter-spacing: var(--display-track); font-size: clamp(2.2rem, 7vw, 4.4rem); line-height: 1.02; text-shadow: var(--title-shadow); }
.mast p { margin: 1rem 0 0; max-width: 40rem; opacity: .9; font-size: 1.05rem; }
.eyebrow { font-weight: 800; text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; color: var(--eyebrow); }
.mast .eyebrow { color: var(--eyebrow-head); }
.swash { height: var(--swash-h); background: linear-gradient(var(--s1) 0 33.3%, var(--s2) 33.3% 66.6%, var(--s3) 66.6% 100%); }

/* Orlando stamp + section */
.mast-grid { grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 2rem; }
.mast-copy { display: grid; gap: .5rem; min-width: 0; }
.stamp { width: clamp(120px, 16vw, 176px); aspect-ratio: 1; color: var(--eyebrow-head); transform: rotate(-12deg); font-family: var(--site); flex: none; }
.stamp svg { width: 100%; height: 100%; display: block; overflow: visible; }
.stamp .stamp-city { font-family: var(--display); }
@media (max-width: 640px) { .mast-grid { grid-template-columns: minmax(0, 1fr); } .stamp { width: 112px; justify-self: end; margin-top: -.5rem; } }
.orl { background: var(--head-bg); color: var(--head-ink); border-block: 1px solid var(--line); }
.orl-grid { padding-block: 3rem; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 2.5rem; align-items: center; }
@media (max-width: 820px) { .orl-grid { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; } }
.orl .eyebrow { color: var(--eyebrow-head); }
.orl h2 { font-family: var(--display); font-weight: var(--display-weight); text-transform: var(--display-case); letter-spacing: var(--display-track); font-size: clamp(2rem, 5.5vw, 3.4rem); line-height: 1.04; margin-top: .4rem; text-shadow: var(--title-shadow); }
.orl p { margin: 1rem 0 0; max-width: 34rem; opacity: .9; font-size: 1.05rem; }
.orl-facts { list-style: none; margin: 0; padding: 0; display: grid; gap: .9rem; }
.orl-facts li { display: grid; gap: .15rem; padding: 1rem 1.1rem; border: 1.5px solid color-mix(in srgb, var(--head-ink) 28%, transparent); border-radius: calc(var(--radius) - 6px); }
.orl-facts strong { font-size: 1.05rem; }
.orl-facts span { opacity: .82; font-size: .95rem; }

/* Splash */
.hero h1 { font-size: clamp(2.3rem, 6.4vw, 4.6rem); line-height: 1.0; max-width: 15ch; }
.hero .btn { background: var(--eyebrow-head); color: var(--head-bg); box-shadow: 4px 4px 0 var(--s1); margin-top: .5rem; }
.mast-logo { display: block; width: min(100%, 560px); height: auto; margin: .2rem 0 .4rem; border-radius: var(--radius); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 1.25rem; }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } }
.tile { display: grid; gap: .7rem; text-decoration: none; color: var(--ink); }
.tile .art { position: relative; aspect-ratio: 1; border-radius: var(--radius); background: var(--t-bg); color: var(--t-ink); overflow: hidden; display: grid; place-items: center; padding: 1.2rem; box-sizing: border-box; border: 1.5px solid var(--t-line); transition: transform .15s ease, box-shadow .15s ease; }
.tile:hover .art, .tile:focus-visible .art { transform: translateY(-3px) rotate(-1deg); box-shadow: 0 10px 24px rgba(0,0,0,.18); }
.tile .art img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.tile .art img.tile-logo { position: static; width: 92%; height: auto; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); margin-bottom: 10px; }
.tile-name { font-family: var(--t-font); text-transform: var(--t-case); font-size: clamp(1.6rem, 3.4vw, 2.2rem); line-height: 1.02; text-align: center; text-shadow: var(--t-shadow); text-wrap: balance; }
.tile .q { font-family: var(--t-font); font-size: clamp(5rem, 11vw, 7.5rem); line-height: 1; color: var(--t-acc); text-shadow: var(--t-shadow); }
.tile-stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: linear-gradient(var(--t-s1) 0 33.3%, var(--t-s2) 33.3% 66.6%, var(--t-s3) 66.6% 100%); }
.tile-meta { display: grid; gap: .1rem; }
.tile-meta strong { font-size: 1.05rem; }
.tile-meta span { color: var(--muted); font-size: .9rem; }
.soon-tile .tile-meta strong { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .tile .art { transition: none; } }

/* Products */
.products { padding-block: 3rem 1rem; }
.section-head { display: grid; gap: .3rem; margin-bottom: 1.5rem; }
.section-head h2 { font-family: var(--display); font-weight: var(--display-weight); text-transform: var(--display-case); letter-spacing: var(--display-track); font-size: clamp(1.7rem, 4vw, 2.3rem); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 1.5rem; }
.card { border-radius: var(--radius); padding: 1.25rem; display: grid; gap: 1rem; align-content: start; position: relative; background: var(--c-bg); color: var(--c-ink); border: 1px solid var(--c-border, transparent); }
.photo { background: #fff; border-radius: calc(var(--radius) - 8px); overflow: hidden; aspect-ratio: 1; max-width: 100%; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs { display: flex; gap: .5rem; }
.thumbs button { width: 58px; height: 58px; padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden; background: #fff; cursor: pointer; }
.thumbs button[aria-pressed="true"] { border-color: var(--c-ink); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { position: absolute; top: 2rem; left: 2rem; background: var(--b-bg); color: var(--b-ink); font-weight: 800; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; padding: .4rem .7rem; border-radius: 999px; box-shadow: 3px 3px 0 var(--btn-shadow); }
.card-row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.card h3 { font-size: 1.3rem; font-weight: 800; }
.price { font-family: var(--display); font-weight: var(--display-weight); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.card p { margin: 0; color: var(--c-muted); }
.card .note { font-size: .88rem; font-weight: 700; color: var(--c-note); }
.sizes-inline { display: flex; gap: .35rem; flex-wrap: wrap; }
.sizes-inline span { font-weight: 700; font-size: .85rem; border: 1.5px solid currentColor; border-radius: 8px; padding: .15rem .55rem; }
.btn { appearance: none; border: 0; cursor: pointer; font: 800 1rem var(--body); letter-spacing: .02em; border-radius: 999px; padding: .85rem 1.4rem; background: var(--btn-bg); color: var(--btn-ink); text-decoration: none; display: inline-flex; justify-content: center; align-items: center; gap: .5rem; transition: transform .12s ease, box-shadow .12s ease; box-shadow: 4px 4px 0 var(--btn-shadow); }
.card .btn { background: var(--cb-bg, var(--btn-bg)); color: var(--cb-ink, var(--btn-ink)); }
.card .btn-soon { opacity: .75; cursor: default; box-shadow: none; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--btn-shadow); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--btn-shadow); }

/* Coming soon */
.soon { border: 2px dashed var(--line); border-radius: var(--radius); padding: 2.5rem 1.5rem; display: grid; gap: .8rem; justify-items: start; max-width: 40rem; }
.soon h3 { font-family: var(--display); font-weight: var(--display-weight); text-transform: var(--display-case); font-size: 1.6rem; }
.soon p { margin: 0; color: var(--muted); }

/* Order */
.order { padding-block: 3rem 4rem; }
.desk { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 2rem; align-items: start; }
@media (max-width: 820px) { .desk { grid-template-columns: minmax(0, 1fr); } }
form { display: grid; gap: 1.75rem; min-width: 0; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: .9rem; min-width: 0; }
legend { font-weight: 800; font-size: 1.05rem; margin-bottom: .6rem; padding: 0; display: flex; gap: .6rem; align-items: center; }
legend .step { font-family: var(--display); font-weight: var(--display-weight); color: var(--eyebrow); font-size: 1.2rem; }
.choices { display: flex; flex-wrap: wrap; gap: .5rem; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice label { display: inline-flex; align-items: center; gap: .55rem; border: 2px solid var(--line); background: var(--field); color: var(--ink); border-radius: 12px; padding: .6rem .9rem; font-weight: 700; cursor: pointer; min-width: 3.2rem; justify-content: center; }
.choice input:checked + label { border-color: var(--btn-bg); background: var(--btn-bg); color: var(--btn-ink); }
.choice input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
.swatch { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgba(128,128,128,.5); flex: none; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: .9rem; }
.field { display: grid; gap: .3rem; min-width: 0; }
.field label { font-weight: 700; font-size: .9rem; }
.field label small { font-weight: 500; color: var(--muted); }
input[type=text], input[type=email], input[type=tel], select, textarea { font: inherit; color: var(--ink); background: var(--field); border: 1.5px solid var(--line); border-radius: 10px; padding: .65rem .75rem; width: 100%; box-sizing: border-box; }
input:focus, select:focus, textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent); }
.field.bad input, .field.bad select { border-color: var(--error); }
.err { color: var(--error); font-size: .85rem; font-weight: 700; }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; background: var(--field); overflow: hidden; width: max-content; }
.qty button { width: 44px; height: 44px; border: 0; background: transparent; font: 800 1.2rem var(--body); color: var(--ink); cursor: pointer; }
.qty button:disabled { opacity: .3; cursor: default; }
.qty output { min-width: 2.5rem; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: .88rem; margin: 0; }

.ticket { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 4.5rem); background: var(--ticket-bg); color: var(--ticket-ink); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.ticket .swash { height: 14px; }
.ticket-body { padding: 1.4rem; display: grid; gap: 1rem; }
.ticket h3 { font-family: var(--display); font-weight: var(--display-weight); text-transform: var(--display-case); font-size: 1.5rem; }
.ticket-item { display: grid; grid-template-columns: 72px 1fr; gap: .9rem; align-items: center; }
.ticket-item img { width: 72px; height: 72px; border-radius: 10px; background: #fff; object-fit: cover; }
.ticket-item strong { display: block; }
.ticket-item span { opacity: .8; font-size: .92rem; }
.lines { display: grid; gap: .35rem; border-top: 1px dashed color-mix(in srgb, var(--ticket-ink) 35%, transparent); padding-top: .9rem; font-variant-numeric: tabular-nums; }
.lines div { display: flex; justify-content: space-between; gap: 1rem; }
.lines .total { font-weight: 800; font-size: 1.2rem; border-top: 1px dashed color-mix(in srgb, var(--ticket-ink) 35%, transparent); padding-top: .6rem; margin-top: .3rem; }
.ticket .btn { background: var(--tbtn-bg); color: var(--tbtn-ink); width: 100%; box-sizing: border-box; }
.ticket .fine { font-size: .84rem; opacity: .82; margin: 0; }
.deal { font-weight: 700; }
.deal-note { font-size: .88rem; font-weight: 700; color: var(--c-note, inherit); }
.add-row { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; }
.added { font-weight: 700; color: var(--eyebrow); margin: 0; }
.cart-lines { display: grid; gap: .9rem; }
.cart-line { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: .9rem; align-items: center; border: 1.5px solid var(--line); background: var(--field); border-radius: 14px; padding: .7rem; }
.cart-line img { width: 72px; height: 72px; border-radius: 10px; background: #fff; object-fit: cover; }
.cart-line strong { display: block; }
.cart-line .meta { color: var(--muted); font-size: .9rem; }
.cart-line .ctl { display: grid; gap: .4rem; justify-items: end; }
.cart-line .qty button { width: 38px; height: 38px; }
.linkbtn { appearance: none; border: 0; background: none; padding: 0; color: var(--muted); font: 700 .85rem var(--body); text-decoration: underline; cursor: pointer; }
@media (max-width: 480px) { .cart-line { grid-template-columns: 60px minmax(0, 1fr); } .cart-line img { width: 60px; height: 60px; } .cart-line .ctl { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; } }
#miniCart { display: grid; gap: 1rem; }
.mini { display: grid; gap: .55rem; }
.mini-item { display: grid; grid-template-columns: 44px 1fr; gap: .7rem; align-items: center; font-size: .92rem; }
.mini-item img { width: 44px; height: 44px; border-radius: 8px; background: #fff; object-fit: cover; }
.mini-item span { opacity: .8; display: block; font-size: .85rem; }
.ticket .empty { opacity: .8; margin: 0; }
.ticket .save { color: inherit; opacity: .85; }
.ticket .btn.ghost { background: transparent; color: inherit; box-shadow: none; border: 1.5px solid currentColor; }
.form-msg { background: var(--error-bg); color: var(--error); border-radius: 10px; padding: .7rem .9rem; font-weight: 700; font-size: .92rem; }

.showfoot { background: var(--head-bg); color: var(--head-ink); }
.showfoot .wrap { padding-block: 1.6rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; align-items: center; font-size: .92rem; }
.mail { font-weight: 700; user-select: all; }
.copy { appearance: none; border: 1.5px solid currentColor; background: transparent; color: inherit; border-radius: 999px; padding: .3rem .8rem; font: 700 .82rem var(--body); cursor: pointer; margin-left: .5rem; }
.sitefoot { background: var(--bar-bg); color: var(--bar-muted); font-family: var(--site); font-size: .85rem; }
.sitefoot .wrap { padding-block: 1.1rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>


<header class="sitebar">
  <div class="wrap">
    <div class="bar-top"><a class="brand" href="#home">PodcastTShirts<b>.com</b></a><a class="cartlink" id="cartLink" href="#cart" aria-label="Cart, 0 shirts">Cart <b id="cartCount">0</b></a></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Shows"></nav>
  </div>
</header>

<main id="app"></main>

<footer class="sitefoot">
  <div class="wrap"><span>© 2026 PodcastTShirts.com</span><span>Merch for podcasts, new and old · Locally made in Orlando, Florida</span></div>
</footer>

<script>
/* =====================================================================
   SITE SETTINGS
   ===================================================================== */
var SITE = {
  paypalEmail: "ohnomediaowen@gmail.com",   // where every payment goes
  contactEmail: "ohnomediaowen@gmail.com",
  podNote: "Every shirt is printed on demand, locally in Orlando, Florida. Printing, shipping and processing take a few weeks.",
  madeIn: "Orlando, FL",
  // Site-wide shirt pricing: the first shirt in the cart costs `first`,
  // every shirt after that costs `additional` (any show, any design).
  pricing: { first: 26, additional: 24 }
};

/* =====================================================================
   SHOWS — each entry is one tab and one page. To add a show, copy a
   block, give it a new id, colors and products. Order here = tab order.
   ===================================================================== */
var HOME = {
  theme: {
    page: "#f4f1eb", ink: "#141414", muted: "#5d5850", line: "#d9d2c5", field: "#ffffff",
    "head-bg": "#141414", "head-ink": "#f4f1eb", eyebrow: "#d9531e", "eyebrow-head": "#f2c14e",
    s1: "#e0592a", s2: "#f2c14e", s3: "#2e8293", "swash-h": "12px",

      '<div id="addrBlock" style="display:grid;gap:.9rem"><div class="field"><label for="addr1">Street address</label><input type="text" id="addr1" autocomplete="address-line1" required></div>' +
      '<div class="field"><label for="addr2">Apt, suite, unit <small>(optional)</small></label><input type="text" id="addr2" autocomplete="address-line2"></div>' +
      '<div class="row"><div class="field"><label for="city">City</label><input type="text" id="city" autocomplete="address-level2" required></div><div class="field"><label for="state">State / province</label><input type="text" id="state" autocomplete="address-level1" required></div><div class="field"><label for="zip">ZIP / postal code</label><input type="text" id="zip" autocomplete="postal-code" required></div></div>' +
      '<div class="field"><label for="country">Country</label><select id="country" autocomplete="country"><option value="US" selected>United States</option><option value="CA">Canada</option><option value="GB">United Kingdom</option><option value="AU">Australia</option></select></div></div>' +
      '<div class="field"><label for="notes">Order notes <small>(optional)</small></label><textarea id="notes" rows="2" maxlength="200"></textarea></div></fieldset></form>' +
      '<aside class="ticket" aria-labelledby="sum-h"><div class="swash" aria-hidden="true"></div><div class="ticket-body"><h3 id="sum-h">Order summary</h3>' +
      '<div class="lines" id="sumLines"></div>' +
      '<div class="form-msg" id="formMsg" hidden></div><a class="btn" id="payBtn" href="#" target="_blank" rel="noopener">Pay with PayPal</a>' +
      '<p class="fine"><strong>Made in Orlando.</strong> ' + esc(SITE.podNote) + ' You’ll finish checkout on PayPal’s secure site, and every shirt, size and your delivery details go with the payment.</p></div></aside></div></section>' + foot;
    initCart(shipping, pickup);
  }

  function initCart(shipping, pickup) {
    var $ = function (id) { return document.getElementById(id); };
    var st = { delivery: "ship" };
    function f() { var o = {}; ["first","last","email","phone","addr1","addr2","city","state","zip","country","notes"].forEach(function (k) { o[k] = $(k).value.trim(); }); return o; }
    function shipCost() { return st.delivery === "ship" ? shipping : 0; }
    function paypalUrl() {
      var v = f(), pk = st.delivery === "pickup", c = loadCart(), n = cartCount(c);
      var params = { cmd: "_cart", upload: "1", business: SITE.paypalEmail, currency_code: "USD", no_shipping: pk ? "1" : "2",
        first_name: v.first, last_name: v.last, email: v.email,
        address1: pk ? "" : v.addr1, address2: pk ? "" : v.addr2, city: pk ? "" : v.city, state: pk ? "" : v.state, zip: pk ? "" : v.zip, country: pk ? "" : v.country,
        "return": location.origin + "/?thanks=1", cancel_return: location.origin + "/#cart",
        custom: ((pk ? "LOCAL PICKUP | " : "") + "Phone: " + (v.phone || "n/a") + " | Notes: " + (v.notes || "none")).slice(0, 255) };
      c.forEach(function (l, i) {
        var f2 = findProduct(l.show, l.id), k = i + 1;
        params["item_name_" + k] = (f2.show.name + " - " + f2.p.name + " - Size " + l.size + (pk ? " - LOCAL PICKUP" : "")).slice(0, 127);
        params["item_number_" + k] = (l.show + "-" + l.id + "-" + l.size).toUpperCase().slice(0, 127);
        params["amount_" + k] = Number(PR.first).toFixed(2);
        params["quantity_" + k] = String(l.qty);
        params["on0_" + k] = "Size"; params["os0_" + k] = l.size;
      });
      if (shipCost() > 0) params.shipping_1 = shipCost().toFixed(2);
      if (n > 1) params.discount_amount_cart = (n * PR.first - priceFor(n)).toFixed(2);
      return "https://www.paypal.com/cgi-bin/webscr?" + Object.keys(params).filter(function (k) { return params[k] !== ""; }).map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }).join("&");
    }
    function drawLines() {
      var c = loadCart();
      if (!c.length) { state.current = null; renderCart(); return false; }
      $("cartLines").innerHTML = c.map(function (l, i) {
        var f2 = findProduct(l.show, l.id), more = productQty(c, l.show, l.id) < maxOf(f2.p);
        return '<div class="cart-line"><img src="' + esc(f2.p.images[0]) + '" alt=""><div><strong>' + esc(f2.p.short || f2.p.name) + '</strong><span class="meta">' + esc(f2.show.name) + ' · Size ' + esc(l.size) + '</span></div>' +
          '<div class="ctl"><div class="qty" aria-label="Quantity"><button type="button" data-q="-1" data-i="' + i + '" aria-label="One fewer"' + (l.qty <= 1 ? " disabled" : "") + '>−</button><output>' + l.qty + '</output><button type="button" data-q="1" data-i="' + i + '" aria-label="One more"' + (more ? "" : " disabled") + '>+</button></div>' +
          '<button type="button" class="linkbtn" data-rm="' + i + '">Remove</button></div></div>';
      }).join("");
      return true;
    }
    function update() {
      var c = loadCart(), n = cartCount(c), pk = st.delivery === "pickup";
      $("sumLines").innerHTML = totalsLines(c) +
        '<div><span>' + (pk ? "Pickup" : "Shipping &amp; handling") + '</span><span>' + (pk ? "Free" : money(shipping)) + '</span></div>' +
        '<div class="total"><span>Total</span><span>' + money(priceFor(n) + shipCost()) + '</span></div>';
      $("addrBlock").hidden = pk; if ($("pickupHint")) $("pickupHint").hidden = !pk;
      $("detailsTitle").textContent = pk ? "Your details" : "Shipping details";
      $("payBtn").href = paypalUrl();
    }
    var REQ = ["first","last","email","addr1","city","state","zip"];
    function validate() {
      var bad = null, need = st.delivery === "pickup" ? REQ.slice(0, 3) : REQ;
      REQ.forEach(function (id) {
        var el = $(id), w = el.closest(".field"), v = el.value.trim(), check = need.indexOf(id) >= 0;
        var ok = !check || (v !== "" && (id !== "email" || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)));
        w.classList.toggle("bad", !ok);
        var e = w.querySelector(".err");
        if (!ok && !e) { e = document.createElement("span"); e.className = "err"; w.appendChild(e); }
        if (e) { e.textContent = ok ? "" : (v === "" ? "Fill this in so we can get your shirts to you." : "Enter an email like name@example.com."); e.hidden = ok; }
        el.setAttribute("aria-invalid", ok ? "false" : "true");
        if (!ok && !bad) bad = el;
      });
      return bad;
    }
    $("payBtn").addEventListener("click", function (ev) {
      var bad = validate();
      if (bad) { ev.preventDefault(); $("formMsg").textContent = "A few details are missing. Fill in the highlighted fields, then tap Pay with PayPal again."; $("formMsg").hidden = false; bad.focus(); bad.scrollIntoView({ block: "center", behavior: "smooth" }); }
      else { $("formMsg").hidden = true; this.href = paypalUrl(); }
    });
    $("cartLines").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      var c = loadCart();
      if (b.dataset.rm !== undefined) c.splice(Number(b.dataset.rm), 1);
      else if (b.dataset.q) { var l = c[Number(b.dataset.i)], f2 = findProduct(l.show, l.id), d = Number(b.dataset.q);
        if (d > 0 && productQty(c, l.show, l.id) >= maxOf(f2.p)) return;
        l.qty = Math.max(1, l.qty + d); }
      saveCart(c); if (drawLines()) update();
    });
    var form = $("orderForm");
    form.addEventListener("change", function (e) {
      if (e.target.name === "delivery") { st.delivery = e.target.value; if (!$("formMsg").hidden) validate(); }
      update();
    });
    form.addEventListener("input", function (e) { var w = e.target.closest(".field"); if (w && w.classList.contains("bad")) validate(); update(); });
    form.addEventListener("submit", function (e) { e.preventDefault(); });
    drawLines(); update();
  }

  function renderThanks() {
    applyTheme(HOME);
    document.title = "Thank you · PodcastTShirts.com";
    selectTab("none");
    app.innerHTML = '<section class="order wrap"><div class="section-head"><span class="eyebrow">Order received</span><h2>Thanks for your order!</h2>' +
      '<p class="hint">PayPal will email your receipt. ' + esc(SITE.podNote) + ' Picking up in Orlando? Email ' + esc(SITE.contactEmail) + ' to set a time.</p></div><p><a class="btn" href="#home">Back to the shows</a></p></section>';
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest(".thumbs button");
    if (t) { document.getElementById(t.dataset.main).src = t.dataset.src; t.parentNode.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", b === t ? "true" : "false"); }); }
    var c = e.target.closest(".copy");
    if (c) {
      var txt = c.dataset.copy, done = function () { c.textContent = "Copied"; setTimeout(function () { c.textContent = "Copy"; }, 1500); };
      var fallback = function () { var m = c.previousElementSibling; if (m) { var r = document.createRange(); r.selectNodeContents(m); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } c.textContent = "Selected"; };
      try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (err) { fallback(); }
    }
  });

  function route() {
    var id = (location.hash || "").slice(1);
    if (id === "order" || id === "shows") return;
    var thanks = /[?&]thanks=1/.test(location.search) && !id;
    var show = SHOWS.filter(function (s) { return s.id === id; })[0];
    var key = thanks ? "thanks" : id === "cart" ? "cart" : show ? show.id : "home";
    document.getElementById("cartLink").setAttribute("aria-current", key === "cart" ? "page" : "false");
    if (state.current === key) return;
    state.current = key;
    if (thanks) { saveCart([]); renderThanks(); try { history.replaceState(null, "", "/"); } catch (e) {} state.current = "thanks"; }
    else if (key === "cart") renderCart(); else if (show) render(show); else renderHome();
    window.scrollTo(0, 0);
  }
  paintCount();
  window.addEventListener("storage", function (e) { if (e.key === CART_KEY) { paintCount(); if (state.current === "cart") { state.current = null; route(); } } });
  window.addEventListener("hashchange", route);
  route();
};
</script>
<script src="/shop-edit.js"></script>
